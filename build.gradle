buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://repo.grails.org/grails/core" }
    }
    dependencies {
        classpath "org.grails:grails-gradle-plugin:$grailsGradlePluginVersion"
        classpath "org.grails.plugins:hibernate5:7.3.0"
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:3.4.7"
        classpath "gradle.plugin.com.github.erdi.webdriver-binaries:webdriver-binaries-gradle-plugin:2.6"
    }
}

version "1.14.6-SNAPSHOT"
group "uk.co.wonderlane.wlpos"

apply plugin:"idea"
//apply plugin:"war"
apply plugin:"org.grails.grails-web"
apply plugin:"com.github.erdi.webdriver-binaries"
apply plugin:"com.bertramlabs.asset-pipeline"
apply plugin:"org.grails.grails-gsp"
apply plugin:"jacoco"

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core" }
    maven {
        url "https://wonderlane.jfrog.io/artifactory/libs-release-local"
        credentials {
            username "$artifactory_user"
            password "$artifactory_password"
        }
        mavenContent {
            releasesOnly()
        }
    }
    maven {
        url "https://wonderlane.jfrog.io/artifactory/libs-snapshot-local"
        credentials {
            username "$artifactory_user"
            password "$artifactory_password"
        }
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    implementation "org.springframework.boot:spring-boot-starter-log4j2"
    modules {
        module("org.springframework.boot:spring-boot-starter-logging") {
            replacedBy("org.springframework.boot:spring-boot-starter-log4j2", "Use Log4j2 instead of Logback")
        }
    }
    implementation ("org.springframework.boot:spring-boot-autoconfigure") {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
    }

    implementation 'uk.co.wonderlane.wlpos:Common:1.14.34-SNAPSHOT'

    implementation "org.grails:grails-core"
    implementation ("org.springframework.boot:spring-boot-starter-actuator")
    implementation ("org.springframework.boot:spring-boot-starter-tomcat")
    implementation "org.grails:grails-web-boot"
    implementation "org.grails:grails-logging"
    implementation "org.grails:grails-plugin-rest"
    implementation "org.grails:grails-plugin-databinding"
    implementation "org.grails:grails-plugin-i18n"
    implementation "org.grails:grails-plugin-services"
    implementation "org.grails:grails-plugin-url-mappings"
    implementation "org.grails:grails-plugin-interceptors"
//    implementation 'org.grails.plugins:cache:5.0.1'
    implementation "org.grails.plugins:async:4.0.0"
    implementation "org.grails.plugins:scaffolding"
    implementation "org.grails.plugins:events"
    implementation "org.grails.plugins:hibernate5"
    implementation "org.hibernate:hibernate-core:5.6.11.Final"
    implementation "org.grails.plugins:gsp"
    compileOnly "io.micronaut:micronaut-inject-groovy"
    console "org.grails:grails-console"
    profile "org.grails.profiles:web"
    runtimeOnly 'org.glassfish.web:el-impl:2.2.1-b05'
    implementation "org.grails.plugins:spring-security-core:5.2.1"
    implementation group: "com.rabbitmq", name: "amqp-client", version: "5.5.3"
    implementation group: "com.google.code.gson", name: "gson", version: "2.8.9"
    runtimeOnly "org.apache.tomcat:tomcat-jdbc"
    runtimeOnly 'com.bertramlabs.plugins:asset-pipeline-grails:3.4.7'
    runtimeOnly 'org.codehaus.groovy:groovy-dateutil'
    implementation 'mysql:mysql-connector-java:8.0.32'
    implementation 'joda-time:joda-time:2.12.2'
    implementation group: 'org.jadira.usertype', name: 'usertype.core', version: '6.0.1.GA' // Mappings for Joda time to Hibernate.
    implementation 'org.grails.plugins:remote-pagination:0.5.0'
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.google.zxing:javase:3.5.1'
    implementation 'org.apache.pdfbox:pdfbox:2.0.27'
    implementation 'org.apache.pdfbox:pdfbox-tools:2.0.27'
    implementation 'com.opencsv:opencsv:5.7.1'
    implementation 'software.amazon.awssdk:s3:2.20.26'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-joda:2.13.0'


    testImplementation "io.micronaut:micronaut-inject-groovy"
    testImplementation "org.grails:grails-gorm-testing-support"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.grails:grails-web-testing-support"
    testImplementation "org.grails.plugins:geb"
    testImplementation "org.grails:grails-test-mixins:3.3.0"
}

bootRun {
    ignoreExitValue true
    jvmArgs(
            '-Dspring.output.ansi.enabled=always',
            '-noverify',
            '-XX:TieredStopAtLevel=1',
            '-Xmx1024m')
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

tasks.withType(GroovyCompile) {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m']
    }
}

assets {
    minifyJs = true
    minifyCss = true
}

webdriverBinaries {

}

tasks.withType(Test) {

}

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/config/*"
            ])
        }))
    }
    reports {
        xml.enabled false
        csv.enabled false
        html.destination file("${buildDir}/reports/jacocoHtml")
    }
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestCoverageVerification {

}

grails {
    pathingJar = true
}

sourceSets {
    elasticbeanstalk
}
