buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://repo.grails.org/grails/core" }
    }
    dependencies {
        classpath "org.grails:grails-gradle-plugin:$grailsGradlePluginVersion"
        classpath "org.grails.plugins:hibernate5:7.3.0"
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:3.4.7"
        classpath "gradle.plugin.com.github.erdi.webdriver-binaries:webdriver-binaries-gradle-plugin:2.6"
    }
}

version "1.15.33.Skillnet-SNAPSHOT"
group "uk.co.wonderlane.wlpos"

apply plugin:"idea"
//apply plugin:"war"
apply plugin:"org.grails.grails-web"
apply plugin:"com.github.erdi.webdriver-binaries"
apply plugin:"com.bertramlabs.asset-pipeline"
apply plugin:"org.grails.grails-gsp"
apply plugin:"jacoco"

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core" }
    maven {
        url "https://wonderlane.jfrog.io/artifactory/libs-release-local"
        credentials {
            username "$artifactory_user"
            password "$artifactory_password"
        }
        mavenContent {
            releasesOnly()
        }
    }
    maven {
        url "https://wonderlane.jfrog.io/artifactory/libs-snapshot-local"
        credentials {
            username "$artifactory_user"
            password "$artifactory_password"
        }
        mavenContent {
            snapshotsOnly()
        }
    }
}

dependencies {
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    implementation "org.springframework.boot:spring-boot-starter-log4j2:2.7.18"
    modules {
        module("org.springframework.boot:spring-boot-starter-logging") {
            replacedBy("org.springframework.boot:spring-boot-starter-log4j2", "Use Log4j2 instead of Logback")
        }
    }
    implementation ("org.springframework.boot:spring-boot-autoconfigure:2.7.18") {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
    }

    implementation 'uk.co.wonderlane.wlpos:Common:1.17.10-SNAPSHOT'

    implementation "org.grails:grails-core:6.1.2"
    implementation ("org.springframework.boot:spring-boot-starter-actuator:2.7.18")
    implementation ("org.springframework.boot:spring-boot-starter-tomcat:2.7.18")
    implementation "org.grails:grails-web-boot:6.1.2"
    implementation "org.grails:grails-logging:6.1.2"
    implementation "org.grails:grails-plugin-rest:6.1.2"
    implementation "org.grails:grails-plugin-databinding:6.1.2"
    implementation "org.grails:grails-plugin-i18n:6.1.2"
    implementation "org.grails:grails-plugin-services:6.1.2"
    implementation "org.grails:grails-plugin-url-mappings:6.1.2"
    implementation "org.grails:grails-plugin-interceptors:6.1.2"
//    implementation 'org.grails.plugins:cache:5.0.1'
    implementation "org.grails.plugins:async:5.0.2"
    implementation "org.grails.plugins:scaffolding:5.0.1"
    implementation "org.grails.plugins:events:5.0.2"
    implementation "org.grails.plugins:hibernate5:8.1.0"
    implementation "org.hibernate:hibernate-core:5.6.15.Final"
    implementation "org.grails.plugins:gsp:6.2.1"
    compileOnly "io.micronaut:micronaut-inject-groovy:3.10.4"
    console "org.grails:grails-console"
    profile "org.grails.profiles:web"
    runtimeOnly 'org.glassfish.web:el-impl:2.2.1-b05'
    implementation "org.grails.plugins:spring-security-core:6.1.1"
    implementation group: "com.rabbitmq", name: "amqp-client", version: "5.21.0"
    implementation group: "com.google.code.gson", name: "gson", version: "2.10.1"
    runtimeOnly "org.apache.tomcat:tomcat-jdbc"
    runtimeOnly 'com.bertramlabs.plugins:asset-pipeline-grails:3.4.7'
    runtimeOnly 'org.codehaus.groovy:groovy-dateutil'
    implementation 'com.mysql:mysql-connector-j:8.2.0'
    implementation 'joda-time:joda-time:2.12.2'
    implementation group: 'org.jadira.usertype', name: 'usertype.core', version: '6.0.1.GA' // Mappings for Joda time to Hibernate.
    implementation 'org.grails.plugins:remote-pagination:0.5.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
    implementation 'org.apache.pdfbox:pdfbox:2.0.32'
    implementation 'org.apache.pdfbox:pdfbox-tools:2.0.32'
    implementation 'com.opencsv:opencsv:5.9'
    implementation 'software.amazon.awssdk:s3:2.25.19'
    implementation 'software.amazon.awssdk:sns:2.25.19'
    implementation 'commons-io:commons-io:2.16.0'
    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-joda', version: '2.12.2'

    testImplementation "io.micronaut:micronaut-inject-groovy"
    testImplementation "org.grails:grails-gorm-testing-support"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.grails:grails-web-testing-support"
    testImplementation "org.grails.plugins:geb"
    testImplementation "org.grails:grails-test-mixins:3.3.0"
}

bootRun {
    ignoreExitValue true
    jvmArgs(
            '-Dspring.output.ansi.enabled=always',
            '-noverify',
            '-XX:TieredStopAtLevel=1',
            '-Xmx1024m')
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

tasks.withType(GroovyCompile) {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m']
    }
}

assets {
    minifyJs = true
    minifyCss = true
}

webdriverBinaries {

}

tasks.withType(Test) {

}

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/config/*"
            ])
        }))
    }
    reports {
        xml.enabled false
        csv.enabled false
        html.destination file("${buildDir}/reports/jacocoHtml")
    }
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestCoverageVerification {

}

grails {
    pathingJar = true
}

sourceSets {
    elasticbeanstalk
}

tasks.named("assemble") {
    def projectName = it.project.name
    def projectVersion = it.project.version

    doLast {
        // Specify the path to the existing zip file.
        def zipFile = file("build/libs/Cloud Office ${projectVersion}.zip")

        // Create a temporary directory to unzip the existing zip.
        def tempDir = file("build/libs/Cloud Office ${projectVersion}")

        // Copy the built .jar to the temporary directory.
        println "Build jar = ${projectName}-${projectVersion}.jar"
        copy {
            from "build/libs/${projectName}-${projectVersion}.jar"
            into tempDir
            rename "${projectName}-${projectVersion}.jar", "application.jar"
        }

        // Copy the Nginx config to the temporary directory.
        copy {
            from "src/elasticbeanstalk/resources/"
            into "${tempDir}/.platform/nginx/conf.d/"
        }

        // Update the existing zip file with the modified content.
        ant.zip(destfile: zipFile) {
            fileset(dir: tempDir)
        }

        // Clean up temporary directory.
        delete(tempDir)
    }
}
