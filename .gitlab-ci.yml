image: gradle:jdk11-alpine

cache:
    paths:
        - gradle

stages:
    - default
    - release
    - tags

## before_script configuration added to resolve 'Author Identity Unknown' error for git commands
before_script:
    - export GIT_USER_EMAIL=$(git log -1 --pretty=format:"%ae")
    - export GIT_USER_NAME=$(git log -1 --pretty=format:"%an")
    - git config user.email "$GIT_USER_EMAIL"
    - git config user.name "$GIT_USER_NAME"
    - echo "https://$DEPLOY_TOKEN_USER:$DEPLOY_TOKEN_PASS@gitlab.com" > ~/.git-credentials
    - git config --global credential.helper store


default_build:
    stage: default
    script:
        - apk update
        - apk upgrade
        - apk add zip curl bash
        - bash doGrailsBuild.sh development $ARTIFACTORY_USERNAME $ARTIFACTORY_PASSWORD
    rules:
         - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_MESSAGE =~ /^Merge branch/ || $CI_COMMIT_REF_NAME =~ /^(sprint|feature)/'

build_release_branches:
    stage: release
    script:    
        - apk update
        - apk upgrade
        - apk add zip curl bash
        - bash doGrailsBuild.sh stage $ARTIFACTORY_USERNAME $ARTIFACTORY_PASSWORD
    rules:
        - if: '$CI_COMMIT_BRANCH =~ /^release/'
    
tags_no_build:
    stage: tags
    script:        
        - echo "Do nothing currently... Production release?"
    rules:
        - if: '$CI_COMMIT_TAG =~ /^[0-9.]+$/'
